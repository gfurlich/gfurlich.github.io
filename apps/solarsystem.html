<!-- Time Display -->
<div id="time-display" style="
  text-align: center;
  font-size: 15px;
  letter-spacing: 0.05em;
">loading…</div>

<!-- Solar System Canvas Container -->
<div class="canvas-container">

  <!-- Night Mode -->
  <div style="float:right" class="row">
    <button id="night-mode-btn">🌜︎︎ Night Mode</button>
  </div>

  <canvas id="solar" width="1000" height="1000" style="display:block;margin:0 auto;max-width:100%"></canvas>

  <!-- Body Info -->
  <div id="info" style="font-size:12px;color:grey;min-height:18px;padding:2px 0;text-align:center">Hover over a planet or minor body to see details</div>

</div>

<!-- Display Controls -->
<div class="ctrl">

  <!-- Date / Playback -->
  <div class="row" style="display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:18px">
    <div style="display:flex;align-items:center;gap:6px">
      <label for="date-input">Date [UTC]</label>
      <input type="datetime-local" id="date-input">
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="-365">−365 d/s</option>
        <option value="-30">−30 d/s</option>
        <option value="-1">−1 d/s</option>
        <option value="0.0000115741">Real time</option>
        <option value="0.0416667">1 hr/s</option>
        <option value="1">1 d/s</option>
        <option value="10" selected>10 d/s</option>
        <option value="30">30 d/s</option>
        <option value="100">100 d/s</option>
        <option value="365">1 yr/s</option>
        <option value="3652.5">10 yr/s</option>
      </select>
    </div>
    <button id="play-btn">⏸ Pause</button>
    <button id="now-btn">Now</button>
    <button id="swap-btn">⇄ Show Earth-Moon Large</button>
  </div>

  <!-- View Radius -->
  <div class="row" style="flex-direction:column;gap:4px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <label for="zoom">View Radius [AU]</label>
      <span id="zoom-display" style="font-size:12px;color:grey">60 AU</span>
    </div>
    <input type="range" id="zoom" value="178" min="20" max="300" step="1" style="width:100%;cursor:pointer">
    <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:6px">
      <button class="preset" data-au="2">Inner</button>
      <button class="preset" data-au="4.5">Asteroid Belt</button>
      <button class="preset" data-au="7">Jupiter</button>
      <button class="preset" data-au="35">Giants</button>
      <button class="preset" data-au="60">Kuiper Belt</button>
      <button class="preset" data-au="1000">Far Reaches</button>
    </div>
  </div>

  <!-- Scale -->
  <div class="row" style="display:flex;align-items:center;justify-content:center;gap:12px">
    <label for="scale">Radial Scale:</label>
    <select id="scale">
      <option value="sqrt" selected>Square root (shows inner + outer)</option>
      <option value="linear">Linear (true proportions)</option>
    </select>
  </div>

  <!-- Layers -->
  <div class="row">
    <label>Display:</label>
    <div id="layer-options" style="display:flex; flex-wrap:wrap; gap:10px;">
      <label style="font-size:12px"><input type="checkbox" value="planetOrbits" checked> Planet orbits</label>
      <label style="font-size:12px"><input type="checkbox" value="minor" checked> Dwarf planets &amp; asteroids</label>
      <label style="font-size:12px"><input type="checkbox" value="minorOrbits" checked> Minor body orbits</label>
      <label style="font-size:12px"><input type="checkbox" value="belt" checked> Asteroid belt</label>
      <label style="font-size:12px"><input type="checkbox" value="trojans" checked> Jupiter Trojans</label>
      <label style="font-size:12px"><input type="checkbox" value="kuiper" checked> Kuiper belt</label>
      <label style="font-size:12px"><input type="checkbox" value="labels" checked> Labels</label>
      <label style="font-size:12px"><input type="checkbox" value="lagrange" checked> Sun-Earth Lagrange points</label>
      <label style="font-size:12px"><input type="checkbox" value="earthInset" checked> Earth-Moon inset</label>
      <label style="font-size:12px"><input type="checkbox" value="emLagrange" checked> Earth-Moon Lagrange points</label>
      <label style="font-size:12px"><input type="checkbox" value="spacecraft" checked> Spacecraft</label>
      <label style="font-size:12px"><input type="checkbox" value="galactic" checked> Galactic Center direction</label>
      <label style="font-size:12px"><input type="checkbox" value="probes" checked> Extra-solar probes</label>
    </div>
  </div>
</div>
